name: Arduino Remote Compile

on:
  repository_dispatch:
    types: [compile_cmd]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR Platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Write Sketch File
        run: |
          mkdir -p build_sketch
          cat << 'ARDUINO_SKETCH_END' > build_sketch/build_sketch.ino
          ${{ github.event.client_payload.code }}
          ARDUINO_SKETCH_END

      - name: Install & Sync Libraries
        run: |
          # Исправлено: используем --overwrite
          arduino-cli config init --overwrite
          arduino-cli config set library.enable_unsafe_install true
          
          arduino-cli lib update-index
          LIBS_PATH="$HOME/Arduino/libraries"
          mkdir -p "$LIBS_PATH"
          
          CUSTOM_DIR="libraries"

          if [ -d "$CUSTOM_DIR" ]; then
            echo "🔍 Checking for custom components in /$CUSTOM_DIR..."
            for H_FILE in "$CUSTOM_DIR"/*.h; do
              [ -f "$H_FILE" ] || continue
              LIB_NAME=$(basename "$H_FILE" .h)
              echo "📄 Installing loose header: $LIB_NAME"
              mkdir -p "$LIBS_PATH/$LIB_NAME"
              cp "$H_FILE" "$LIBS_PATH/$LIB_NAME/"
            done

            for ZIP in "$CUSTOM_DIR"/*.zip; do
              [ -f "$ZIP" ] || continue
              echo "📦 Installing ZIP: $(basename "$ZIP")"
              arduino-cli lib install --zip-path "$ZIP"
            done

            for DIR in "$CUSTOM_DIR"/*/; do
              [ -d "$DIR" ] || continue
              echo "📂 Copying folder: $(basename "$DIR")"
              cp -r "$DIR" "$LIBS_PATH/"
            done
          fi

          SKETCH="build_sketch/build_sketch.ino"
          INCLUDES=$(grep -oP '(?<=#include\s[<"])[\w./]+\.h' "$SKETCH" || true)
          
          for H in $INCLUDES; do
            case "$H" in Arduino.h|avr/*.h|util/*.h|pgmspace.h|interrupt.h) continue ;; esac
            LIB_G="${H%.h}"
            if [ ! -d "$LIBS_PATH/$LIB_G" ]; then
              echo "📥 Auto-installing: $LIB_G"
              arduino-cli lib install "$LIB_G" || echo "⚠️ $LIB_G not found"
            fi
          done

      - name: Run Compiler
        run: |
          echo "🔨 Starting build for Arduino Uno..."
          arduino-cli compile --fqbn arduino:avr:uno --output-dir ./out build_sketch

      - name: Push Firmware to Builds
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git fetch origin builds || true
          git checkout -B builds

          cp out/build_sketch.ino.hex firmware.hex
          git add firmware.hex
          git commit -m "Build: ${{ github.event.client_payload.timestamp }}" || echo "No changes"
          git push origin builds --force
