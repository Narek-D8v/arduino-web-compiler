name: Arduino Remote Compile

on:
  repository_dispatch:
    types: [compile_cmd]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Write Sketch
        run: |
          mkdir -p build_sketch
          cat << 'ARDUINO_SKETCH_END' > build_sketch/build_sketch.ino
          ${{ github.event.client_payload.code }}
          ARDUINO_SKETCH_END

      - name: Install Libraries
        run: |
          arduino-cli lib update-index

          ARDUINO_LIBS_DIR="$HOME/Arduino/libraries"
          mkdir -p "$ARDUINO_LIBS_DIR"

          # ── 1. Кастомные библиотеки из /libraries/ в репозитории ─────────────
          CUSTOM_LIBS_DIR="libraries"

          if [ -d "$CUSTOM_LIBS_DIR" ]; then
            # ZIP-файлы
            for ZIP_PATH in "$CUSTOM_LIBS_DIR"/*.zip; do
              [ -f "$ZIP_PATH" ] || continue
              echo "📦 Installing ZIP library: $ZIP_PATH"
              arduino-cli lib install --zip-path "$ZIP_PATH" \
                && echo "✓ Installed: $ZIP_PATH" \
                || echo "⚠ Warning: failed to install $ZIP_PATH"
            done

            # Папки с библиотеками (распакованные)
            for LIB_PATH in "$CUSTOM_LIBS_DIR"/*/; do
              [ -d "$LIB_PATH" ] || continue
              LIB_NAME=$(basename "$LIB_PATH")
              echo "📂 Copying custom library folder: $LIB_NAME"
              cp -r "$LIB_PATH" "$ARDUINO_LIBS_DIR/$LIB_NAME"
              echo "✓ Copied: $LIB_NAME → $ARDUINO_LIBS_DIR"
            done
          else
            echo "No /libraries directory found — skipping custom libs"
          fi

          # ── 2. Известные библиотеки из Arduino Library Manager ───────────────
          declare -A LIB_MAP=(
            ["Servo.h"]="Servo"
            ["Wire.h"]="Wire"
            ["SPI.h"]="SPI"
            ["EEPROM.h"]="EEPROM"
            ["SD.h"]="SD"
            ["Adafruit_NeoPixel.h"]="Adafruit NeoPixel"
            ["DHT.h"]="DHT sensor library"
            ["LiquidCrystal.h"]="LiquidCrystal"
            ["LiquidCrystal_I2C.h"]="LiquidCrystal I2C"
            ["U8g2lib.h"]="U8g2"
            ["Adafruit_GFX.h"]="Adafruit GFX Library"
            ["Adafruit_SSD1306.h"]="Adafruit SSD1306"
            ["TFT_eSPI.h"]="TFT_eSPI"
            ["FastLED.h"]="FastLED"
            ["Stepper.h"]="Stepper"
            ["AccelStepper.h"]="AccelStepper"
            ["IRremote.h"]="IRremote"
            ["RF24.h"]="RF24"
            ["WiFi.h"]="WiFi"
            ["WebServer.h"]="WebServer"
            ["HTTPClient.h"]="HTTPClient"
            ["ArduinoJson.h"]="ArduinoJson"
            ["PubSubClient.h"]="PubSubClient"
            ["Ticker.h"]="Ticker"
            ["TimerOne.h"]="TimerOne"
            ["OneWire.h"]="OneWire"
            ["DallasTemperature.h"]="DallasTemperature"
            ["MPU6050.h"]="MPU6050"
            ["Adafruit_BME280.h"]="Adafruit BME280 library"
            ["Adafruit_BMP280.h"]="Adafruit BMP280 library"
            ["Ultrasonic.h"]="Ultrasonic"
            ["Keypad.h"]="Keypad"
            ["RotaryEncoder.h"]="RotaryEncoder"
            ["Bounce2.h"]="Bounce2"
            ["Keyboard.h"]="Keyboard"
            ["Mouse.h"]="Mouse"
            ["SoftwareSerial.h"]="SoftwareSerial"
            ["MFRC522.h"]="MFRC522"
            ["TinyGPS++.h"]="TinyGPSPlus"
            ["Ethernet.h"]="Ethernet"
          )

          # Извлекаем все #include из скетча
          SKETCH="build_sketch/build_sketch.ino"
          INCLUDES=$(grep -oP '(?<=#include\s[<"])[\w./]+\.h' "$SKETCH" || true)
          echo "Found includes: $INCLUDES"

          for HEADER in $INCLUDES; do
            # Пропускаем стандартные заголовки Arduino (уже встроены)
            case "$HEADER" in
              Arduino.h|avr/*.h|util/*.h|pgmspace.h|interrupt.h)
                echo "Skipping built-in: $HEADER"
                continue
                ;;
            esac

            # Пропускаем если уже установлена как кастомная
            HEADER_NAME="${HEADER%.h}"
            if [ -d "$ARDUINO_LIBS_DIR/$HEADER_NAME" ]; then
              echo "Skipping $HEADER — already installed as custom library"
              continue
            fi

            if [[ -n "${LIB_MAP[$HEADER]+_}" ]]; then
              LIB_NAME="${LIB_MAP[$HEADER]}"
              echo "📥 Installing from registry: $LIB_NAME (for $HEADER)"
              arduino-cli lib install "$LIB_NAME" \
                && echo "✓ Installed: $LIB_NAME" \
                || echo "⚠ Warning: could not install $LIB_NAME"
            else
              # Fallback: пробуем установить по имени без .h
              LIB_GUESS="${HEADER%.h}"
              echo "❓ Unknown header $HEADER — trying: $LIB_GUESS"
              arduino-cli lib install "$LIB_GUESS" \
                && echo "✓ Installed: $LIB_GUESS" \
                || echo "⚠ Warning: $LIB_GUESS not found in registry"
            fi
          done

      - name: Compile Sketch
        run: |
          echo "🔨 Compiling for Arduino Uno..."
          arduino-cli compile \
            --fqbn arduino:avr:uno \
            --output-dir ./out \
            build_sketch
          echo "✓ Compilation successful"

      - name: Push Firmware to builds branch
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git fetch origin builds || true
          git checkout -B builds

          cp out/build_sketch.ino.hex firmware.hex

          git add firmware.hex
          git commit -m "firmware: ${{ github.event.client_payload.timestamp }}" || echo "No changes to commit"
          git push origin builds --force

          echo "✓ firmware.hex pushed to builds branch"
