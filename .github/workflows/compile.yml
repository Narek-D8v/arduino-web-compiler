name: Arduino & ESP32 Remote Compile

on:
  repository_dispatch:
    types: [compile_cmd]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Platforms
        run: |
          arduino-cli core update-index
          # Ставим AVR для Uno/Nano
          arduino-cli core install arduino:avr
          # Ставим поддержку ESP32
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Write Sketch
        run: |
          mkdir -p build_sketch
          cat << 'ARDUINO_SKETCH_END' > build_sketch/build_sketch.ino
          ${{ github.event.client_payload.code }}
          ARDUINO_SKETCH_END

      - name: Install Libraries
        run: |
          arduino-cli lib update-index
          # Если в коде есть дисплей, ставим зависимости
          arduino-cli lib install "Adafruit GFX Library" "Adafruit BusIO" "Adafruit SSD1306"
          # Твои кастомные либы из папки /libraries
          if [ -d "libraries" ]; then
            cp -r libraries/* $HOME/Arduino/libraries/ || true
          fi

      - name: Compile
        run: |
          # Выбираем FQBN на основе данных из Payload (от твоего сайта)
          # Если плата не передана, по умолчанию Uno
          BOARD="${{ github.event.client_payload.board }}"
          if [[ "$BOARD" == "esp32" ]]; then
            FQBN="esp32:esp32:esp32"
          else
            FQBN="arduino:avr:uno"
          fi
          
          echo "🔨 Compiling for $FQBN..."
          arduino-cli compile --fqbn $FQBN --output-dir ./out build_sketch

      - name: Push Artifacts
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          git fetch origin builds || true
          git checkout -B builds

          # Очищаем старые билды
          rm -f firmware.hex firmware.bin

          # Сохраняем нужный формат в зависимости от того, что скомпилировалось
          [ -f out/build_sketch.ino.hex ] && cp out/build_sketch.ino.hex firmware.hex
          [ -f out/build_sketch.ino.bin ] && cp out/build_sketch.ino.bin firmware.bin

          git add firmware.hex firmware.bin
          git commit -m "Build for ${{ github.event.client_payload.board }} at ${{ github.event.client_payload.timestamp }}"
          git push origin builds --force
