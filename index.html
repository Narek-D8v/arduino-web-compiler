<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Cloud Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-tertiary: #1a2332;
            --accent-primary: #00ff88;
            --accent-secondary: #0099ff;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --border-color: #1f2937;
            --error: #ff4466;
            --warning: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 9999;
        }

        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }

        .glow-orb.primary {
            background: var(--accent-primary);
            top: -200px;
            right: -200px;
        }

        .glow-orb.secondary {
            background: var(--accent-secondary);
            bottom: -200px;
            left: -200px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.05em;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
        }

        .input-field {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-secondary);
            box-shadow: 0 0 20px rgba(0, 153, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-success {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-primary);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .status-success .status-dot {
            background: var(--accent-primary);
        }

        .status-error {
            background: rgba(255, 68, 102, 0.1);
            color: var(--error);
            border: 1px solid rgba(255, 68, 102, 0.2);
        }

        .status-error .status-dot {
            background: var(--error);
        }

        .status-info {
            background: rgba(0, 153, 255, 0.1);
            color: var(--accent-secondary);
            border: 1px solid rgba(0, 153, 255, 0.2);
        }

        .status-info .status-dot {
            background: var(--accent-secondary);
        }

        .status-warning {
            background: rgba(255, 170, 0, 0.1);
            color: var(--warning);
            border: 1px solid rgba(255, 170, 0, 0.2);
        }

        .status-warning .status-dot {
            background: var(--warning);
        }

        #editor-container {
            height: 600px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        #editor-container:hover {
            border-color: var(--accent-secondary);
            box-shadow: 0 0 30px rgba(0, 153, 255, 0.1);
        }

        .label {
            display: block;
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            border: 2px solid var(--bg-tertiary);
            border-top: 2px solid var(--accent-primary);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .connection-status {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.75rem;
            }

            #editor-container {
                height: 400px;
            }

            .btn {
                padding: 0.75rem 1.25rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="grid-pattern"></div>
    <div class="glow-orb primary"></div>
    <div class="glow-orb secondary"></div>

    <div class="connection-status" id="connectionStatus"></div>

    <div class="container mx-auto px-4 py-8 max-w-7xl relative z-10">
        <!-- Header -->
        <header class="mb-12 text-center">
            <h1 class="mb-4">Arduino Cloud Editor</h1>
            <p class="text-text-secondary text-lg">Code, Compile, and Flash — All in Your Browser</p>
        </header>



        <!-- Editor Section -->
        <div class="card mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-accent-secondary" style="font-family: 'Syne', sans-serif;">Code Editor</h2>
                <div class="flex gap-3">
                    <button class="btn btn-secondary" onclick="clearEditor()">
                        <span>Clear</span>
                    </button>
                    <button class="btn btn-secondary" onclick="loadExample()">
                        <span>Load Example</span>
                    </button>
                </div>
            </div>
            <div id="editor-container"></div>
        </div>

        <!-- Actions Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="card">
                <h3 class="text-lg font-bold mb-4 text-accent-primary" style="font-family: 'Syne', sans-serif;">Build</h3>
                <button class="btn btn-primary w-full" onclick="compileCode()" id="compileBtn">
                    <span>🔨 Compile</span>
                </button>
                <div id="compileStatus" class="mt-4"></div>
            </div>

            <div class="card">
                <h3 class="text-lg font-bold mb-4 text-accent-secondary" style="font-family: 'Syne', sans-serif;">Flash</h3>
                
                <!-- Board and Baud Rate Selection -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="label">Board Type</label>
                        <select id="boardType" class="input-field">
                            <option value="uno">Arduino Uno</option>
                            <option value="nano">Arduino Nano</option>
                            <option value="mega">Arduino Mega</option>
                            <option value="leonardo">Arduino Leonardo</option>
                            <option value="esp32">ESP32</option>
                            <option value="esp32-s2">ESP32-S2</option>
                            <option value="esp32-s3">ESP32-S3</option>
                            <option value="esp32-c3">ESP32-C3</option>
                        </select>
                    </div>
                    <div>
                        <label class="label">Baud Rate</label>
                        <select id="baudRate" class="input-field">
                            <option value="115200">115200</option>
                            <option value="57600">57600</option>
                            <option value="38400">38400</option>
                            <option value="19200">19200</option>
                            <option value="9600">9600</option>
                        </select>
                    </div>
                </div>

                <!-- Connect and Flash Buttons -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                    <button class="btn btn-secondary w-full" onclick="connectSerial()" id="connectBtn">
                        <span>🔌 Connect to Board</span>
                    </button>
                    <button class="btn btn-primary w-full" onclick="flashArduino()" id="flashBtn" disabled>
                        <span>⚡ Flash Device</span>
                    </button>
                </div>

                <div id="flashStatus" class="mb-4"></div>

                <!-- Connection Status -->
                <div id="portStatus" class="text-sm text-text-secondary"></div>
            </div>
        </div>

        <!-- Console Section -->
        <div class="card mb-8">
            <h2 class="text-xl font-bold mb-6 text-accent-primary" style="font-family: 'Syne', sans-serif;">Console Output</h2>
            <div id="console" class="bg-bg-tertiary p-4 rounded-lg h-64 overflow-y-auto font-mono text-sm" style="font-family: 'JetBrains Mono', monospace;">
                <div class="text-text-secondary">Ready to compile and flash...</div>
            </div>
        </div>

        <!-- Serial Monitor Section -->
        <div class="card">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-accent-secondary" style="font-family: 'Syne', sans-serif;">Serial Monitor</h2>
                <div class="flex gap-3 items-center">
                    <select id="serialBaudRate" class="input-field" style="width: auto; padding: 0.5rem 1rem;">
                        <option value="9600">9600</option>
                        <option value="19200">19200</option>
                        <option value="38400">38400</option>
                        <option value="57600">57600</option>
                        <option value="115200">115200</option>
                    </select>
                    <button class="btn btn-secondary" onclick="startSerialMonitor()" id="serialStartBtn" disabled>
                        <span>▶ Start</span>
                    </button>
                    <button class="btn btn-secondary" onclick="stopSerialMonitor()" id="serialStopBtn" disabled>
                        <span>⏹ Stop</span>
                    </button>
                    <button class="btn btn-secondary" onclick="clearSerialMonitor()">
                        <span>Clear</span>
                    </button>
                </div>
            </div>
            <div id="serialMonitor" class="bg-bg-tertiary p-4 rounded-lg h-64 overflow-y-auto font-mono text-sm" style="font-family: 'JetBrains Mono', monospace;">
                <div class="text-text-secondary">Connect to board and start serial monitor...</div>
            </div>
            <div class="mt-4 flex gap-3">
                <input 
                    type="text" 
                    id="serialInput" 
                    class="input-field flex-1" 
                    placeholder="Type message to send..."
                    disabled
                >
                <button class="btn btn-primary" onclick="sendSerialData()" id="serialSendBtn" disabled>
                    <span>Send</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    
    <!-- AVRGirl Arduino -->
    <script src="https://cdn.jsdelivr.net/npm/avrgirl-arduino@3.0.0/dist/avrgirl-arduino.min.js"></script>

    <!-- ESPTool for ESP32 -->
    <script src="https://unpkg.com/esptool-js@0.4.0/bundle.js"></script>

    <script>
        let editor;
        let avrgirl;
        let serialPort = null;
        let serialReader = null;
        let serialWriter = null;
        let isSerialReading = false;
        let esploader = null;

        // Initialize Monaco Editor
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});
        
        require(['vs/editor/editor.main'], function() {
            // Register Arduino-specific autocomplete
            monaco.languages.registerCompletionItemProvider('cpp', {
                provideCompletionItems: function(model, position) {
                    const suggestions = [
                        // Arduino Functions
                        {
                            label: 'pinMode',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'pinMode(${1:pin}, ${2:mode});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Configures the specified pin to behave either as an input or an output.\nParameters: pin (int), mode (INPUT, OUTPUT, INPUT_PULLUP)'
                        },
                        {
                            label: 'digitalWrite',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'digitalWrite(${1:pin}, ${2:value});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Write a HIGH or a LOW value to a digital pin.\nParameters: pin (int), value (HIGH or LOW)'
                        },
                        {
                            label: 'digitalRead',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'digitalRead(${1:pin})',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Reads the value from a specified digital pin, either HIGH or LOW.\nParameters: pin (int)\nReturns: HIGH or LOW'
                        },
                        {
                            label: 'analogWrite',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'analogWrite(${1:pin}, ${2:value});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Writes an analog value (PWM wave) to a pin.\nParameters: pin (int), value (0-255)'
                        },
                        {
                            label: 'analogRead',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'analogRead(${1:pin})',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Reads the value from the specified analog pin.\nParameters: pin (int A0-A5)\nReturns: 0-1023'
                        },
                        {
                            label: 'delay',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'delay(${1:ms});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Pauses the program for the amount of time (in milliseconds) specified.\nParameters: ms (unsigned long)'
                        },
                        {
                            label: 'delayMicroseconds',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'delayMicroseconds(${1:us});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Pauses the program for the amount of time (in microseconds) specified.\nParameters: us (unsigned int)'
                        },
                        {
                            label: 'millis',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'millis()',
                            documentation: 'Returns the number of milliseconds since the Arduino board began running.\nReturns: unsigned long'
                        },
                        {
                            label: 'micros',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'micros()',
                            documentation: 'Returns the number of microseconds since the Arduino board began running.\nReturns: unsigned long'
                        },
                        // Serial Functions
                        {
                            label: 'Serial.begin',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'Serial.begin(${1:9600});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Sets the data rate in bits per second (baud) for serial data transmission.\nCommon values: 9600, 115200'
                        },
                        {
                            label: 'Serial.print',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'Serial.print(${1:data});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Prints data to the serial port as human-readable ASCII text.'
                        },
                        {
                            label: 'Serial.println',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'Serial.println(${1:data});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Prints data to the serial port followed by a carriage return and newline.'
                        },
                        {
                            label: 'Serial.available',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'Serial.available()',
                            documentation: 'Get the number of bytes available for reading from the serial port.\nReturns: int'
                        },
                        {
                            label: 'Serial.read',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'Serial.read()',
                            documentation: 'Reads incoming serial data.\nReturns: int (first byte of incoming data, or -1 if no data)'
                        },
                        {
                            label: 'Serial.write',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'Serial.write(${1:data});',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Writes binary data to the serial port.'
                        },
                        // Math Functions
                        {
                            label: 'map',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'map(${1:value}, ${2:fromLow}, ${3:fromHigh}, ${4:toLow}, ${5:toHigh})',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Re-maps a number from one range to another.'
                        },
                        {
                            label: 'constrain',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'constrain(${1:x}, ${2:a}, ${3:b})',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Constrains a number to be within a range.'
                        },
                        {
                            label: 'random',
                            kind: monaco.languages.CompletionItemKind.Function,
                            insertText: 'random(${1:min}, ${2:max})',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'Generates pseudo-random numbers.'
                        },
                        // Constants
                        {
                            label: 'HIGH',
                            kind: monaco.languages.CompletionItemKind.Constant,
                            insertText: 'HIGH',
                            documentation: 'Digital pin state: HIGH (1, 5V)'
                        },
                        {
                            label: 'LOW',
                            kind: monaco.languages.CompletionItemKind.Constant,
                            insertText: 'LOW',
                            documentation: 'Digital pin state: LOW (0, 0V)'
                        },
                        {
                            label: 'INPUT',
                            kind: monaco.languages.CompletionItemKind.Constant,
                            insertText: 'INPUT',
                            documentation: 'Pin mode: INPUT'
                        },
                        {
                            label: 'OUTPUT',
                            kind: monaco.languages.CompletionItemKind.Constant,
                            insertText: 'OUTPUT',
                            documentation: 'Pin mode: OUTPUT'
                        },
                        {
                            label: 'INPUT_PULLUP',
                            kind: monaco.languages.CompletionItemKind.Constant,
                            insertText: 'INPUT_PULLUP',
                            documentation: 'Pin mode: INPUT with internal pullup resistor'
                        },
                        {
                            label: 'LED_BUILTIN',
                            kind: monaco.languages.CompletionItemKind.Constant,
                            insertText: 'LED_BUILTIN',
                            documentation: 'Built-in LED pin (usually pin 13)'
                        },
                        // Structure
                        {
                            label: 'setup',
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertText: 'void setup() {\n\t${1:// Setup code}\n}',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'The setup() function is called when a sketch starts.'
                        },
                        {
                            label: 'loop',
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertText: 'void loop() {\n\t${1:// Main code}\n}',
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            documentation: 'The loop() function loops consecutively, allowing your program to change and respond.'
                        },
                        // Analog pins
                        { label: 'A0', kind: monaco.languages.CompletionItemKind.Constant, insertText: 'A0', documentation: 'Analog pin 0' },
                        { label: 'A1', kind: monaco.languages.CompletionItemKind.Constant, insertText: 'A1', documentation: 'Analog pin 1' },
                        { label: 'A2', kind: monaco.languages.CompletionItemKind.Constant, insertText: 'A2', documentation: 'Analog pin 2' },
                        { label: 'A3', kind: monaco.languages.CompletionItemKind.Constant, insertText: 'A3', documentation: 'Analog pin 3' },
                        { label: 'A4', kind: monaco.languages.CompletionItemKind.Constant, insertText: 'A4', documentation: 'Analog pin 4' },
                        { label: 'A5', kind: monaco.languages.CompletionItemKind.Constant, insertText: 'A5', documentation: 'Analog pin 5' },
                    ];
                    
                    return { suggestions: suggestions };
                }
            });

            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: `// Arduino Sketch
void setup() {
  // Initialize digital pin LED_BUILTIN as an output
  pinMode(LED_BUILTIN, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  digitalWrite(LED_BUILTIN, HIGH);  // Turn the LED on
  Serial.println("LED ON");
  delay(1000);                      // Wait for a second
  
  digitalWrite(LED_BUILTIN, LOW);   // Turn the LED off
  Serial.println("LED OFF");
  delay(1000);                      // Wait for a second

        // Console logging
        function logToConsole(message, type = 'info') {
            const console = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: '#9ca3af',
                success: '#00ff88',
                error: '#ff4466',
                warning: '#ffaa00'
            };
            
            const logEntry = document.createElement('div');
            logEntry.style.color = colors[type];
            logEntry.style.marginBottom = '0.5rem';
            logEntry.innerHTML = `<span style="color: #6b7280;">[${timestamp}]</span> ${message}`;
            
            console.appendChild(logEntry);
            console.scrollTop = console.scrollHeight;
        }

        // Clear console
        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        // Show status
        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            const icons = {
                success: '✓',
                error: '✗',
                info: 'ℹ',
                warning: '⚠'
            };
            
            element.innerHTML = `
                <div class="status-indicator status-${type}">
                    <span class="status-dot"></span>
                    <span>${icons[type]} ${message}</span>
                </div>
            `;
        }

        // Clear status
        function clearStatus(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        // Compile code
        async function compileCode() {
                const code = editor.getValue();
                const compileBtn = document.getElementById('compileBtn');

                compileBtn.disabled = true;
                compileBtn.innerHTML = '<span><div class="spinner"></div>Compiling...</span>';
                clearStatus('compileStatus');
                
                logToConsole('🔨 Starting compilation...', 'info');
                logToConsole('Repository: Narek-D8v/arduino-web-compiler', 'info');

                try {
                    const response = await fetch('/api/compile', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            code: code
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showStatus('compileStatus', 'Compilation triggered successfully!', 'success');
                        logToConsole('✓ Compilation request sent to GitHub Actions', 'success');
                        logToConsole('Check your repository Actions tab for build status', 'info');
                        logToConsole(`Timestamp: ${result.timestamp}`, 'info');
                    } else {
                        throw new Error(result.error || 'Unknown error occurred');
                    }
                } catch (error) {
                    showStatus('compileStatus', 'Compilation failed', 'error');
                    logToConsole(`✗ Error: ${error.message}`, 'error');
                    console.error(error);
                } finally {
                    compileBtn.disabled = false;
                    compileBtn.innerHTML = '<span>🔨 Compile</span>';
                }
        }

        // Connect to Serial Port
        async function connectSerial() {
            const connectBtn = document.getElementById('connectBtn');
            const flashBtn = document.getElementById('flashBtn');
            const serialStartBtn = document.getElementById('serialStartBtn');
            const portStatus = document.getElementById('portStatus');
            const boardType = document.getElementById('boardType').value;

            try {
                if (!navigator.serial) {
                    throw new Error('Web Serial API not supported. Please use Chrome, Edge, or Opera.');
                }

                logToConsole('🔌 Requesting serial port access...', 'info');
                connectBtn.disabled = true;
                connectBtn.innerHTML = '<span><div class="spinner"></div>Connecting...</span>';

                // Different USB vendor IDs for different boards
                const filters = [
                    { usbVendorId: 0x2341 }, // Arduino
                    { usbVendorId: 0x1a86 }, // CH340
                    { usbVendorId: 0x0403 }, // FTDI
                    { usbVendorId: 0x10c4 }, // Silicon Labs CP210x (ESP32)
                    { usbVendorId: 0x1a86 }, // CH9102 (ESP32)
                    { usbVendorId: 0x303a }  // Espressif USB JTAG/serial debug unit (ESP32-S2/S3/C3)
                ];

                serialPort = await navigator.serial.requestPort({ filters });

                const baudRate = parseInt(document.getElementById('baudRate').value);
                
                await serialPort.open({ baudRate: baudRate });

                // Get writer for sending data
                serialWriter = serialPort.writable.getWriter();

                const boardName = boardType.toUpperCase().replace(/-/g, ' ');
                logToConsole(`✓ Connected to ${boardName} at ${baudRate} baud`, 'success');
                portStatus.innerHTML = `<span class="text-accent-primary">● Connected to ${boardName} at ${baudRate} baud</span>`;

                // Enable flash and serial monitor buttons
                flashBtn.disabled = false;
                serialStartBtn.disabled = false;
                connectBtn.innerHTML = '<span>🔌 Connected</span>';
                connectBtn.disabled = true;

            } catch (error) {
                logToConsole(`✗ Connection error: ${error.message}`, 'error');
                portStatus.innerHTML = `<span class="text-error">● Disconnected</span>`;
                connectBtn.disabled = false;
                connectBtn.innerHTML = '<span>🔌 Connect to Board</span>';
            }
        }

        // Disconnect Serial Port
        async function disconnectSerial() {
            try {
                if (isSerialReading) {
                    await stopSerialMonitor();
                }

                if (serialWriter) {
                    await serialWriter.releaseLock();
                    serialWriter = null;
                }

                if (serialPort) {
                    await serialPort.close();
                    serialPort = null;
                }

                document.getElementById('flashBtn').disabled = true;
                document.getElementById('serialStartBtn').disabled = true;
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('connectBtn').innerHTML = '<span>🔌 Connect to Board</span>';
                document.getElementById('portStatus').innerHTML = `<span class="text-text-secondary">● Disconnected</span>`;

                logToConsole('✓ Serial port disconnected', 'info');
            } catch (error) {
                logToConsole(`✗ Disconnect error: ${error.message}`, 'error');
            }
        }

        // Flash Arduino
        async function flashArduino() {
                if (!serialPort) {
                    showStatus('flashStatus', 'Please connect to board first', 'error');
                    logToConsole('✗ No serial port connected. Click "Connect to Board" first.', 'error');
                    return;
                }

                const flashBtn = document.getElementById('flashBtn');
                const boardType = document.getElementById('boardType').value;

                flashBtn.disabled = true;
                flashBtn.innerHTML = '<span><div class="spinner"></div>Flashing...</span>';
                clearStatus('flashStatus');
                
                logToConsole('⚡ Starting flash process...', 'info');

                try {
                    // Temporarily disconnect serial monitor if running
                    const wasReading = isSerialReading;
                    if (isSerialReading) {
                        await stopSerialMonitor();
                    }

                    // Скачиваем firmware.hex из ветки builds с cache busting
                    const timestamp = Date.now();
                    const firmwareUrl = `https://raw.githubusercontent.com/Narek-D8v/arduino-web-compiler/builds/firmware.hex?t=${timestamp}`;
                    
                    logToConsole('📥 Downloading firmware.hex from builds branch...', 'info');
                    showStatus('flashStatus', 'Downloading firmware...', 'info');
                    
                    const firmwareResponse = await fetch(firmwareUrl, {
                        cache: 'no-store'  // Дополнительная защита от кэша
                    });

                    if (!firmwareResponse.ok) {
                        throw new Error(`Failed to download firmware: ${firmwareResponse.status}. Make sure firmware.hex exists in the builds branch.`);
                    }

                    const hexData = await firmwareResponse.text();
                    
                    // Проверяем, что файл не пустой и является валидным HEX
                    if (!hexData || hexData.length < 100) {
                        throw new Error('Downloaded firmware file is empty or corrupted');
                    }
                    
                    if (!hexData.includes(':') || !hexData.match(/^:/m)) {
                        throw new Error('Invalid HEX file format');
                    }
                    
                    logToConsole('✓ Firmware downloaded successfully', 'success');
                    logToConsole(`Firmware size: ${hexData.length} bytes`, 'info');

                    showStatus('flashStatus', 'Flashing device...', 'info');

                    // Инициализируем AVRGirl с выбранным типом платы
                    logToConsole(`⚡ Initializing AVRGirl for ${boardType.toUpperCase()}...`, 'info');
                    
                    avrgirl = new AvrgirlArduino({
                        board: boardType,
                        port: serialPort
                    });

                    // Прошиваем плату
                    logToConsole(`⚡ Uploading firmware to ${boardType.toUpperCase()}...`, 'info');
                    logToConsole('Please wait, this may take 10-30 seconds...', 'warning');
                    
                    await new Promise((resolve, reject) => {
                        avrgirl.flash(hexData, (error) => {
                            if (error) {
                                reject(error);
                            } else {
                                resolve();
                            }
                        });
                    });

                    showStatus('flashStatus', 'Flash completed successfully!', 'success');
                    logToConsole('✓ Arduino flashed successfully!', 'success');
                    logToConsole('Your device is now running the new firmware', 'success');

                    // Reconnect serial monitor if it was running
                    if (wasReading) {
                        setTimeout(() => {
                            startSerialMonitor();
                        }, 1000);
                    }

                } catch (error) {
                    showStatus('flashStatus', 'Flash failed', 'error');
                    
                    // Специфичные сообщения об ошибках
                    if (error.message.includes('No port selected')) {
                        logToConsole('✗ No serial port selected. Please connect first.', 'error');
                    } else if (error.message.includes('download')) {
                        logToConsole('✗ Failed to download firmware. Please compile first.', 'error');
                    } else if (error.message.includes('Invalid HEX')) {
                        logToConsole('✗ Firmware file is corrupted. Please recompile.', 'error');
                    } else {
                        logToConsole(`✗ Flash error: ${error.message}`, 'error');
                    }
                    
                    console.error(error);
                } finally {
                    flashBtn.disabled = false;
                    flashBtn.innerHTML = '<span>⚡ Flash Device</span>';
                }
        }

        // Serial Monitor Functions
        function logToSerialMonitor(message, color = '#e5e7eb') {
            const monitor = document.getElementById('serialMonitor');
            const timestamp = new Date().toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.style.color = color;
            logEntry.style.marginBottom = '0.25rem';
            logEntry.innerHTML = `<span style="color: #6b7280;">[${timestamp}]</span> ${message}`;
            
            monitor.appendChild(logEntry);
            monitor.scrollTop = monitor.scrollHeight;
        }

        function clearSerialMonitor() {
            document.getElementById('serialMonitor').innerHTML = '';
            logToSerialMonitor('Serial monitor cleared', '#9ca3af');
        }

        async function startSerialMonitor() {
            if (!serialPort) {
                logToConsole('✗ No serial port connected', 'error');
                return;
            }

            if (isSerialReading) {
                logToConsole('⚠ Serial monitor already running', 'warning');
                return;
            }

            try {
                const serialBaudRate = parseInt(document.getElementById('serialBaudRate').value);

                // Close and reopen port with new baud rate if different
                const currentBaudRate = parseInt(document.getElementById('baudRate').value);
                if (serialBaudRate !== currentBaudRate) {
                    logToConsole(`Reconnecting at ${serialBaudRate} baud...`, 'info');
                    
                    if (serialWriter) {
                        await serialWriter.releaseLock();
                    }
                    await serialPort.close();
                    
                    await serialPort.open({ baudRate: serialBaudRate });
                    serialWriter = serialPort.writable.getWriter();
                    
                    document.getElementById('baudRate').value = serialBaudRate;
                    document.getElementById('portStatus').innerHTML = `<span class="text-accent-primary">● Connected at ${serialBaudRate} baud</span>`;
                }

                isSerialReading = true;
                
                // Enable/disable buttons
                document.getElementById('serialStartBtn').disabled = true;
                document.getElementById('serialStopBtn').disabled = false;
                document.getElementById('serialInput').disabled = false;
                document.getElementById('serialSendBtn').disabled = false;

                logToSerialMonitor('=== Serial Monitor Started ===', '#00ff88');
                logToConsole(`✓ Serial monitor started at ${serialBaudRate} baud`, 'success');

                // Start reading
                serialReader = serialPort.readable.getReader();
                
                while (isSerialReading && serialPort.readable) {
                    try {
                        const { value, done } = await serialReader.read();
                        if (done) break;
                        
                        const text = new TextDecoder().decode(value);
                        logToSerialMonitor(text.trim(), '#e5e7eb');
                    } catch (error) {
                        if (isSerialReading) {
                            logToConsole(`✗ Read error: ${error.message}`, 'error');
                        }
                        break;
                    }
                }

            } catch (error) {
                logToConsole(`✗ Serial monitor error: ${error.message}`, 'error');
                isSerialReading = false;
            }
        }

        async function stopSerialMonitor() {
            if (!isSerialReading) return;

            isSerialReading = false;

            try {
                if (serialReader) {
                    await serialReader.cancel();
                    await serialReader.releaseLock();
                    serialReader = null;
                }

                document.getElementById('serialStartBtn').disabled = false;
                document.getElementById('serialStopBtn').disabled = true;
                document.getElementById('serialInput').disabled = true;
                document.getElementById('serialSendBtn').disabled = true;

                logToSerialMonitor('=== Serial Monitor Stopped ===', '#ffaa00');
                logToConsole('✓ Serial monitor stopped', 'info');
            } catch (error) {
                logToConsole(`✗ Error stopping serial monitor: ${error.message}`, 'error');
            }
        }

        async function sendSerialData() {
            if (!serialWriter) {
                logToConsole('✗ Serial port not ready for writing', 'error');
                return;
            }

            const input = document.getElementById('serialInput');
            const data = input.value;

            if (!data) return;

            try {
                const encoder = new TextEncoder();
                await serialWriter.write(encoder.encode(data + '\n'));
                
                logToSerialMonitor(`>> ${data}`, '#0099ff');
                input.value = '';
            } catch (error) {
                logToConsole(`✗ Send error: ${error.message}`, 'error');
            }
        }

        // Allow Enter key to send serial data
        document.addEventListener('DOMContentLoaded', function() {
            const serialInput = document.getElementById('serialInput');
            if (serialInput) {
                serialInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        sendSerialData();
                    }
                });
            }
        });

        function clearEditor() {
            if (confirm('Are you sure you want to clear the editor?')) {
                editor.setValue('');
                logToConsole('Editor cleared', 'info');
            }
        }

            editor.setValue(exampleCode);

        // Check Web Serial API support

            const status = document.getElementById('connectionStatus');
            status.innerHTML = `
                <div class="status-indicator status-warning">
                    <span class="status-dot"></span>
                    <span>Web Serial not supported in this browser</span>
                </div>
            `;
            logToConsole('⚠ Web Serial API not supported. Flashing will not work.', 'warning');
            logToConsole('Please use Chrome, Edge, or Opera browser.', 'warning');

        }

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + Enter to compile
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                compileCode();
            }
            // Ctrl/Cmd + Shift + F to flash
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'F') {
                e.preventDefault();
                flashArduino();
            }
        });

        logToConsole('💡 Tip: Press Ctrl+Enter to compile, Ctrl+Shift+F to flash', 'info');
    </script>
