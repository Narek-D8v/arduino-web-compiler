name: Arduino & ESP32 Remote Compile
run-name: Compile ${{ github.event.client_payload.request_id || github.event.client_payload.board }}

on:
  repository_dispatch:
    types: [compile_cmd]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Platforms
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Write Project
        env:
          PROJECT_REQUEST_PATH: ${{ github.event.client_payload.project_path }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def c_string(value, limit=512):
              return str(value or "")[:limit].replace("\\", "\\\\").replace('"', '\\"').replace("\r", "\\r").replace("\n", "\\n")

          def insert_after_includes(source, line):
              if line in source:
                  return source
              lines = source.splitlines()
              last_include = -1
              for index, text in enumerate(lines):
                  if re.match(r"\s*#\s*include\b", text):
                      last_include = index
              lines.insert(last_include + 1, line)
              return "\n".join(lines) + ("\n" if source.endswith("\n") else "")

          def inject_call(source, function_name, call):
              if call in source:
                  return source
              pattern = re.compile(r"(\bvoid\s+" + re.escape(function_name) + r"\s*\(\s*(?:void)?\s*\)\s*\{)")
              if pattern.search(source):
                  return pattern.sub(r"\1\n  " + call, source, count=1)
              return source + f"\n\nvoid {function_name}() {{\n  {call}\n}}\n"

          def smart_wifi_header(config):
              ap_ssid = c_string(config.get("apSsid") or "ESP32-Setup", 48)
              ap_pass = c_string(config.get("apPass") or "", 64)
              title = c_string(config.get("portalTitle") or "ESP32 Wi-Fi Setup", 64)
              accent = c_string(config.get("accent") or "#00e676", 16)
              timeout = int(config.get("timeoutSeconds") or 12)
              timeout = max(3, min(60, timeout)) * 1000
              return f'''#pragma once
          #if defined(ESP32) || defined(ARDUINO_ARCH_ESP32)
          #include <Arduino.h>
          #include <WiFi.h>
          #include <WebServer.h>
          #include <DNSServer.h>
          #include <Preferences.h>

          #if __has_include("secrets.h")
          #include "secrets.h"
          #endif

          #ifndef SECRET_SSID
          #define SECRET_SSID ""
          #endif
          #ifndef SECRET_PASS
          #define SECRET_PASS ""
          #endif

          #define SMART_WIFI_AP_SSID "{ap_ssid}"
          #define SMART_WIFI_AP_PASS "{ap_pass}"
          #define SMART_WIFI_PORTAL_TITLE "{title}"
          #define SMART_WIFI_ACCENT "{accent}"
          #define SMART_WIFI_TIMEOUT_MS {timeout}UL

          namespace SmartWiFi {{
            static const byte DNS_PORT = 53;
            static DNSServer dns;
            static WebServer server(80);
            static Preferences prefs;
            static bool portalActive = false;

            static String chipSuffix() {{
              uint64_t mac = ESP.getEfuseMac();
              String value = String((uint32_t)(mac & 0xFFFFFF), HEX);
              value.toUpperCase();
              return value;
            }}

            static String savedValue(const char *key) {{
              prefs.begin("smartwifi", true);
              String value = prefs.getString(key, "");
              prefs.end();
              return value;
            }}

            static void saveCredentials(const String &ssid, const String &pass) {{
              prefs.begin("smartwifi", false);
              prefs.putString("ssid", ssid);
              prefs.putString("pass", pass);
              prefs.end();
            }}

            static String page() {{
              String html;
              html.reserve(2400);
              html += F("<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'>");
              html += F("<title>");
              html += SMART_WIFI_PORTAL_TITLE;
              html += F("</title><style>body{{margin:0;font-family:Arial,sans-serif;background:#071018;color:#e2e8f0}}main{{max-width:420px;margin:8vh auto;padding:24px}}h1{{font-size:24px;margin:0 0 10px}}p{{color:#9aa7b7;line-height:1.45}}input,button{{width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #263244;padding:12px;margin-top:10px;font-size:16px}}input{{background:#111827;color:#fff}}button{{border:none;background:");
              html += SMART_WIFI_ACCENT;
              html += F(";color:#061018;font-weight:700}}</style></head><body><main><h1>");
              html += SMART_WIFI_PORTAL_TITLE;
              html += F("</h1><p>Select your home Wi-Fi network and save credentials.</p><form method='POST' action='/save'><input name='ssid' placeholder='Wi-Fi SSID' autofocus><input name='pass' type='password' placeholder='Wi-Fi password'><button>Save and reboot</button></form></main></body></html>");
              return html;
            }}

            static void handleRoot() {{
              server.send(200, "text/html", page());
            }}

            static void handleSave() {{
              String ssid = server.arg("ssid");
              String pass = server.arg("pass");
              ssid.trim();
              if (!ssid.length()) {{
                server.send(400, "text/plain", "SSID is required");
                return;
              }}
              saveCredentials(ssid, pass);
              server.send(200, "text/html", "<!doctype html><meta name='viewport' content='width=device-width,initial-scale=1'><body style='font-family:Arial,sans-serif;background:#071018;color:#e2e8f0;padding:32px'><h2>Saved</h2><p>ESP32 is rebooting.</p></body>");
              delay(700);
              ESP.restart();
            }}

            static void startPortal() {{
              WiFi.mode(WIFI_AP_STA);
              String apName = SMART_WIFI_AP_SSID;
              if (!apName.length()) apName = "ESP32-Setup";
              apName += "-";
              apName += chipSuffix();
              const char *apPass = SMART_WIFI_AP_PASS;
              if (strlen(apPass) >= 8) WiFi.softAP(apName.c_str(), apPass);
              else WiFi.softAP(apName.c_str());
              IPAddress ip = WiFi.softAPIP();
              dns.start(DNS_PORT, "*", ip);
              server.on("/", HTTP_GET, handleRoot);
              server.on("/save", HTTP_POST, handleSave);
              server.onNotFound(handleRoot);
              server.begin();
              portalActive = true;
              Serial.print("Smart Wi-Fi portal: ");
              Serial.println(apName);
              Serial.print("Open http://");
              Serial.println(ip);
            }}

            static bool connectStation(unsigned long timeoutMs) {{
              String ssid = savedValue("ssid");
              String pass = savedValue("pass");
              if (!ssid.length()) {{
                ssid = SECRET_SSID;
                pass = SECRET_PASS;
              }}
              ssid.trim();
              if (!ssid.length()) return false;
              WiFi.mode(WIFI_STA);
              WiFi.begin(ssid.c_str(), pass.c_str());
              Serial.print("Smart Wi-Fi connecting to ");
              Serial.println(ssid);
              unsigned long started = millis();
              while (WiFi.status() != WL_CONNECTED && millis() - started < timeoutMs) {{
                delay(250);
                Serial.print(".");
              }}
              Serial.println();
              if (WiFi.status() == WL_CONNECTED) {{
                Serial.print("Smart Wi-Fi connected: ");
                Serial.println(WiFi.localIP());
                return true;
              }}
              WiFi.disconnect(true);
              return false;
            }}

            inline void handle();

            inline void begin(unsigned long timeoutMs = SMART_WIFI_TIMEOUT_MS) {{
              if (!connectStation(timeoutMs)) {{
                startPortal();
                while (portalActive) {{
                  handle();
                  delay(2);
                }}
              }}
            }}

            inline void handle() {{
              if (!portalActive) return;
              dns.processNextRequest();
              server.handleClient();
            }}
          }}
          #else
          namespace SmartWiFi {{
            inline void begin(unsigned long timeoutMs = 0) {{ (void)timeoutMs; }}
            inline void handle() {{}}
          }}
          #endif
          '''

          request_path = os.environ.get("PROJECT_REQUEST_PATH", "")
          if not request_path.startswith(".compile-requests/"):
              raise SystemExit(f"Invalid project request path: {request_path}")

          request_file = Path(request_path)
          if not request_file.is_file():
              raise SystemExit(f"Project request file not found: {request_path}")

          data = json.loads(request_file.read_text(encoding="utf-8"))
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          payload = {}
          if event_path and Path(event_path).is_file():
              payload = json.loads(Path(event_path).read_text(encoding="utf-8")).get("client_payload", {})

          board = str(payload.get("board", ""))
          features = data.get("features", {})
          smart_config = data.get("smartWifi", {})
          smart_enabled = board.startswith("esp32") and isinstance(features, dict) and bool(features.get("smartWifi")) and isinstance(smart_config, dict)

          out_dir = Path("build_sketch")
          out_dir.mkdir(exist_ok=True)
          allowed_exts = {".h", ".hpp", ".hh", ".c", ".cpp", ".cc", ".ino", ".txt", ".json", ".csv"}

          code = str(data.get("code", ""))
          if not code.strip():
              raise SystemExit("Project request has no sketch code")
          if smart_enabled:
              code = insert_after_includes(code, '#include "smart_wifi.h"')
              code = inject_call(code, "setup", "SmartWiFi.begin();")
              code = inject_call(code, "loop", "SmartWiFi.handle();")
          (out_dir / "build_sketch.ino").write_text(code, encoding="utf-8", newline="\n")
          print("Wrote project file: build_sketch.ino")

          files = data.get("files", [])
          if not isinstance(files, list):
              files = []

          for item in files[:40]:
              name = str(item.get("name", ""))
              name = name.replace("\\", "/").split("/")[-1]
              name = re.sub(r"[^A-Za-z0-9._-]", "_", name).lstrip(".")[:64]
              if not name or name == "build_sketch.ino":
                  continue
              if smart_enabled and name == "smart_wifi.h":
                  continue
              if Path(name).suffix.lower() not in allowed_exts:
                  continue
              content = str(item.get("content", ""))[:180000]
              (out_dir / name).write_text(content, encoding="utf-8", newline="\n")
              print(f"Wrote project file: {name}")

          secrets = payload.get("secrets", {})
          if smart_enabled or (isinstance(secrets, dict) and (secrets.get("WIFI_SSID") or secrets.get("WIFI_PASS"))):
              if not isinstance(secrets, dict):
                  secrets = {}
              secrets_header = "\n".join([
                  "#pragma once",
                  f"#define SECRET_SSID \"{c_string(secrets.get('WIFI_SSID'))}\"",
                  f"#define SECRET_PASS \"{c_string(secrets.get('WIFI_PASS'))}\"",
                  ""
              ])
              (out_dir / "secrets.h").write_text(secrets_header, encoding="utf-8", newline="\n")
              print("Wrote generated project file: secrets.h")

          if smart_enabled:
              (out_dir / "smart_wifi.h").write_text(smart_wifi_header(smart_config), encoding="utf-8", newline="\n")
              print("Wrote generated project file: smart_wifi.h")
          PY

      - name: Install Libraries
        run: |
          arduino-cli lib update-index

          ARDUINO_LIBS_DIR="$HOME/Arduino/libraries"
          mkdir -p "$ARDUINO_LIBS_DIR"

          if [ -d "libraries" ]; then
            for ZIP_PATH in libraries/*.zip; do
              [ -f "$ZIP_PATH" ] || continue
              echo "Installing ZIP: $ZIP_PATH"
              arduino-cli lib install --zip-path "$ZIP_PATH" || echo "Failed: $ZIP_PATH"
            done
            for LIB_PATH in libraries/*/; do
              [ -d "$LIB_PATH" ] || continue
              LIB_NAME=$(basename "$LIB_PATH")
              echo "Copying: $LIB_NAME"
              cp -r "$LIB_PATH" "$ARDUINO_LIBS_DIR/$LIB_NAME"
            done
          fi

          declare -A LIB_MAP=(
            ["Servo.h"]="Servo"
            ["Wire.h"]="Wire"
            ["SPI.h"]="SPI"
            ["EEPROM.h"]="EEPROM"
            ["SD.h"]="SD"
            ["Adafruit_NeoPixel.h"]="Adafruit NeoPixel"
            ["DHT.h"]="DHT sensor library"
            ["LiquidCrystal.h"]="LiquidCrystal"
            ["LiquidCrystal_I2C.h"]="LiquidCrystal I2C"
            ["U8g2lib.h"]="U8g2"
            ["Adafruit_GFX.h"]="Adafruit GFX Library"
            ["Adafruit_SSD1306.h"]="Adafruit SSD1306"
            ["Adafruit_BusIO.h"]="Adafruit BusIO"
            ["TFT_eSPI.h"]="TFT_eSPI"
            ["FastLED.h"]="FastLED"
            ["Stepper.h"]="Stepper"
            ["AccelStepper.h"]="AccelStepper"
            ["IRremote.h"]="IRremote"
            ["RF24.h"]="RF24"
            ["WiFi.h"]="WiFi"
            ["WebServer.h"]="WebServer"
            ["HTTPClient.h"]="HTTPClient"
            ["ArduinoJson.h"]="ArduinoJson"
            ["PubSubClient.h"]="PubSubClient"
            ["Ticker.h"]="Ticker"
            ["TimerOne.h"]="TimerOne"
            ["OneWire.h"]="OneWire"
            ["DallasTemperature.h"]="DallasTemperature"
            ["MPU6050.h"]="MPU6050"
            ["Adafruit_BME280.h"]="Adafruit BME280 library"
            ["Adafruit_BMP280.h"]="Adafruit BMP280 library"
            ["Ultrasonic.h"]="Ultrasonic"
            ["Keypad.h"]="Keypad"
            ["RotaryEncoder.h"]="RotaryEncoder"
            ["Bounce2.h"]="Bounce2"
            ["Keyboard.h"]="Keyboard"
            ["Mouse.h"]="Mouse"
            ["SoftwareSerial.h"]="SoftwareSerial"
            ["MFRC522.h"]="MFRC522"
            ["TinyGPS++.h"]="TinyGPSPlus"
            ["Ethernet.h"]="Ethernet"
          )

          INCLUDES=$(grep -RhoP '(?<=#include\s[<"])[\w./]+\.h' build_sketch || true)
          echo "Found includes: $INCLUDES"

          for HEADER in $INCLUDES; do
            case "$HEADER" in
              Arduino.h|avr/*.h|util/*.h|pgmspace.h|interrupt.h|esp_*.h|freertos/*.h|DNSServer.h|Preferences.h)
                continue ;;
            esac

            HEADER_NAME="${HEADER%.h}"
            if [ -d "$ARDUINO_LIBS_DIR/$HEADER_NAME" ]; then
              echo "Already installed custom library: $HEADER"
              continue
            fi

            if [[ -n "${LIB_MAP[$HEADER]+_}" ]]; then
              echo "Installing: ${LIB_MAP[$HEADER]}"
              arduino-cli lib install "${LIB_MAP[$HEADER]}" || echo "Could not install ${LIB_MAP[$HEADER]}"
            else
              GUESS="${HEADER%.h}"
              echo "Trying library by name: $GUESS"
              arduino-cli lib install "$GUESS" || echo "Not found: $GUESS"
            fi
          done

      - name: Compile
        run: |
          BOARD="${{ github.event.client_payload.board }}"
          PAYLOAD_FQBN="${{ github.event.client_payload.fqbn }}"

          if [[ "$BOARD" == esp32* ]]; then
            FQBN="${PAYLOAD_FQBN:-esp32:esp32:esp32}"
          else
            FQBN="${PAYLOAD_FQBN:-arduino:avr:uno}"
          fi

          echo "Compiling for $FQBN..."
          arduino-cli compile --fqbn "$FQBN" --output-dir ./out --export-binaries build_sketch
          echo "Compilation successful"
          echo "=== Output files ==="
          ls -la out/

      - name: Push Artifacts
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git fetch origin builds || true
          git checkout -B builds

          rm -f firmware.hex firmware.bin merged-firmware.bin bootloader.bin partitions.bin boot_app0.bin manifest.json

          BOARD="${{ github.event.client_payload.board }}"

          if [[ "$BOARD" == esp32* ]]; then
            echo "=== ESP32 build artifacts ==="
            ls -la out/

            cp out/build_sketch.ino.bin firmware.bin && echo "firmware.bin"

            MERGED_BIN=$(find out/ -name "*.merged.bin" | head -1)
            if [ -n "$MERGED_BIN" ]; then
              cp "$MERGED_BIN" merged-firmware.bin && echo "merged-firmware.bin"
            fi

            BOOTLOADER=$(find ~/.arduino15/packages/esp32 -path "*/boot_image/bootloader_dio_40m.bin" | head -1)
            if [ -z "$BOOTLOADER" ]; then
              BOOTLOADER=$(find ~/.arduino15/packages/esp32 -name "bootloader_dio_40m.bin" | head -1)
            fi
            [ -n "$BOOTLOADER" ] && cp "$BOOTLOADER" bootloader.bin && echo "bootloader.bin"

            PART_OUT=$(find out/ -name "*partition*.bin" -o -name "partitions.bin" | head -1)
            if [ -n "$PART_OUT" ]; then
              cp "$PART_OUT" partitions.bin && echo "partitions.bin from out"
            else
              PARTITIONS=$(find ~/.arduino15/packages/esp32 -path "*/partitions/default.bin" | head -1)
              if [ -z "$PARTITIONS" ]; then
                PARTITIONS=$(find ~/.arduino15/packages/esp32 -name "default.bin" | head -1)
              fi
              [ -n "$PARTITIONS" ] && cp "$PARTITIONS" partitions.bin && echo "partitions.bin"
            fi

            BOOT_APP=$(find ~/.arduino15/packages/esp32 -name "boot_app0.bin" | head -1)
            [ -n "$BOOT_APP" ] && cp "$BOOT_APP" boot_app0.bin && echo "boot_app0.bin"

            if [ ! -f bootloader.bin ]; then
              BOOT_OUT=$(find out/ -name "*bootloader*" | head -1)
              [ -n "$BOOT_OUT" ] && cp "$BOOT_OUT" bootloader.bin && echo "bootloader.bin from out"
            fi
            if [ ! -f partitions.bin ]; then
              PART_OUT=$(find out/ -name "*partition*" | head -1)
              [ -n "$PART_OUT" ] && cp "$PART_OUT" partitions.bin && echo "partitions.bin from out"
            fi

            CHIP_FAMILY="ESP32"
            BOOTLOADER_OFFSET="4096"
            case "$BOARD" in
              esp32-s3*)
                CHIP_FAMILY="ESP32-S3"
                BOOTLOADER_OFFSET="0"
                ;;
              esp32-c3*)
                CHIP_FAMILY="ESP32-C3"
                BOOTLOADER_OFFSET="0"
                ;;
            esac

            if [ -f merged-firmware.bin ]; then
              cat > manifest.json <<EOF
          {
            "name": "Arduino Web Compiler",
            "version": "${{ github.event.client_payload.timestamp }}",
            "builds": [
              {
                "chipFamily": "$CHIP_FAMILY",
                "parts": [
                  { "path": "merged-firmware.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF
            else
              cat > manifest.json <<EOF
          {
            "name": "Arduino Web Compiler",
            "version": "${{ github.event.client_payload.timestamp }}",
            "builds": [
              {
                "chipFamily": "$CHIP_FAMILY",
                "parts": [
                  { "path": "bootloader.bin", "offset": $BOOTLOADER_OFFSET },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "boot_app0.bin", "offset": 57344 },
                  { "path": "firmware.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF
            fi

            echo "=== Final artifacts ==="
            ls -la *.bin manifest.json 2>/dev/null || true
            cat manifest.json

            [ -f firmware.bin ] && git add firmware.bin
            [ -f merged-firmware.bin ] && git add merged-firmware.bin
            [ -f bootloader.bin ] && git add bootloader.bin
            [ -f partitions.bin ] && git add partitions.bin
            [ -f boot_app0.bin ] && git add boot_app0.bin
            [ -f manifest.json ] && git add manifest.json
          else
            cp out/build_sketch.ino.hex firmware.hex && echo "firmware.hex"
            [ -f firmware.hex ] && git add firmware.hex
          fi

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Build: ${{ github.event.client_payload.board }} @ ${{ github.event.client_payload.timestamp }}"
          git push origin builds --force
          echo "Artifacts pushed to builds branch"

      - name: Cleanup Compile Request
        if: always()
        run: |
          REQUEST_PATH="${{ github.event.client_payload.project_path }}"
          if [ -z "$REQUEST_PATH" ]; then
            exit 0
          fi
          case "$REQUEST_PATH" in
            .compile-requests/*) ;;
            *) echo "Skip invalid request path: $REQUEST_PATH"; exit 0 ;;
          esac

          git fetch origin main
          git checkout main
          if [ ! -f "$REQUEST_PATH" ]; then
            echo "Request file already removed"
            exit 0
          fi

          git rm "$REQUEST_PATH"
          git commit -m "Cleanup compile request"
          git push origin main
