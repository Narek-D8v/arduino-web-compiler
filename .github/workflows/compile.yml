name: Arduino Remote Compile

on:
  repository_dispatch:
    types: [compile_cmd]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR Platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Write Sketch File
        run: |
          mkdir -p build_sketch
          cat << 'ARDUINO_SKETCH_END' > build_sketch/build_sketch.ino
          ${{ github.event.client_payload.code }}
          ARDUINO_SKETCH_END

      - name: Install & Sync Libraries
        run: |
          # 1. Настройка конфига
          arduino-cli config init --overwrite
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib update-index
          
          LIBS_PATH="$HOME/Arduino/libraries"
          mkdir -p "$LIBS_PATH"
          
          CUSTOM_DIR="libraries"

          if [ -d "$CUSTOM_DIR" ]; then
            echo "🔍 Processing /$CUSTOM_DIR..."
            
            # Установка ZIP-архивов с очисткой
            # Ищем только реальные .zip файлы, игнорируя скрытые папки
            find "$CUSTOM_DIR" -maxdepth 1 -name "*.zip" -type f | while read ZIP; do
              echo "📦 Attempting to install ZIP: $(basename "$ZIP")"
              # Пробуем установить. Если не вышло — выводим лог, но не падаем сразу
              arduino-cli lib install --zip-path "$ZIP" || echo "❌ Failed to install $ZIP"
            done

            # Обработка одиночных .h файлов
            find "$CUSTOM_DIR" -maxdepth 1 -name "*.h" -type f | while read H_FILE; do
              LIB_NAME=$(basename "$H_FILE" .h)
              echo "📄 Installing loose header: $LIB_NAME"
              mkdir -p "$LIBS_PATH/$LIB_NAME"
              cp "$H_FILE" "$LIBS_PATH/$LIB_NAME/"
            done

            # Копирование папок
            find "$CUSTOM_DIR" -maxdepth 1 -mindepth 1 -type d | while read DIR; do
              BN=$(basename "$DIR")
              # Пропускаем скрытые папки (начинаются с точки)
              [[ "$BN" == .* ]] && continue
              echo "📂 Copying folder: $BN"
              cp -r "$DIR" "$LIBS_PATH/"
            done
          fi

          # 2. Авто-установка зависимостей из кода
          SKETCH="build_sketch/build_sketch.ino"
          INCLUDES=$(grep -oP '(?<=#include\s[<"])[\w./]+\.h' "$SKETCH" || true)
          
          for H in $INCLUDES; do
            case "$H" in Arduino.h|avr/*.h|util/*.h|pgmspace.h|interrupt.h) continue ;; esac
            LIB_G="${H%.h}"
            # Проверяем, не установили ли мы её уже из кастомных
            if [ ! -d "$LIBS_PATH/$LIB_G" ]; then
              echo "📥 Registry install: $LIB_G"
              arduino-cli lib install "$LIB_G" || echo "⚠️ $LIB_G not found in registry"
            fi
          done

      - name: Run Compiler
        run: |
          echo "🔨 Compiling for Arduino Uno..."
          arduino-cli compile --fqbn arduino:avr:uno --output-dir ./out build_sketch

      - name: Push Firmware
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin builds || true
          git checkout -B builds
          cp out/build_sketch.ino.hex firmware.hex
          git add firmware.hex
          git commit -m "Build: ${{ github.event.client_payload.timestamp }}" || echo "No changes"
          git push origin builds --force
